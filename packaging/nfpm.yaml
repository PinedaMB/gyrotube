name: gyrotube
arch: amd64
platform: linux
version: ${GYROTUBE_PACKAGE_VERSION}
release: ${GYROTUBE_PACKAGE_RELEASE}
section: sound
priority: optional
maintainer: GyroTube <gyrotube@localhost>
description: Desktop player for YouTube Music with GTK4 and GStreamer.
contents:
  - src: ${GYROTUBE_PACKAGE_BINARY}
    expand: true
    dst: /usr/bin/gyrotube
    file_info:
      mode: 0755
  - src: ./data/com.github.gyrotube.GyroTube.desktop
    dst: /usr/share/applications/com.github.gyrotube.GyroTube.desktop
    file_info:
      mode: 0644
  - src: ./gyrotube.svg
    dst: /usr/share/icons/hicolor/scalable/apps/com.github.gyrotube.GyroTube.svg
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - libc6 (>= 2.41)
      - libgtk-4-1 (>= 4.14)
      - libadwaita-1-0 (>= 1.6)
      - libssl3t64
      - libgstreamer1.0-0
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-libav
      - glib-networking
      - librsvg2-common
      - webp-pixbuf-loader
      - ca-certificates
      - yt-dlp (>= 2025.11.12)
    recommends:
      - nodejs (>= 22)
  rpm:
    depends:
      - glibc >= 2.44
      - gtk4 >= 4.14
      - libadwaita >= 1.6
      - openssl-libs
      - gstreamer1
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - gstreamer1-plugins-bad-free
      - gstreamer1-plugin-libav
      - glib-networking
      - ca-certificates
      - yt-dlp >= 2025.11.12
      - nodejs >= 22
