[package]
name = "gyrotube-gtk"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gyrotube"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
gstreamer = "0.25.4"
gtk4 = { version = "0.11.5", features = ["v4_14"] }
gyrotube-core = { path = "../../crates/gyrotube-core" }
libadwaita = { version = "0.9.2", features = ["v1_6"] }
mpris-server = "0.11.0"
relm4-icons = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net", "io-util"] }

[build-dependencies]
relm4-icons-build = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
