<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 1. Canto 3D inferior (Esmeralda oscuro con reflejo metálico) -->
    <linearGradient id="rim-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="25%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- 2. Superficie de la esfera (Jade metálico más armónico) -->
    <radialGradient id="sphere-surface" cx="0.5" cy="0.22" r="0.8">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="85%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </radialGradient>

    <!-- 3. Plato de vinilo interior (Obsidiana profundo) -->
    <radialGradient id="vinyl-core" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#2a2733" />
      <stop offset="65%" stop-color="#16141c" />
      <stop offset="100%" stop-color="#0d0c12" />
    </radialGradient>

    <!-- 4. Estela dorada principal (De blanco cálido/oro brillante a transparente) -->
    <linearGradient id="gold-trail-1" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </linearGradient>

    <!-- 5. Estela dorada secundaria (Ámbar suave para dar profundidad) -->
    <linearGradient id="gold-trail-2" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </linearGradient>

    <!-- 6. Engaste metálico central (Puente visual entre el oro y el rojo) -->
    <linearGradient id="gold-bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- 7. Botón central (Carmesí rubí equilibrado) -->
    <linearGradient id="center-crimson" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5c6c" />
      <stop offset="45%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Sombra global GNOME HIG -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Sombra y Canto 3D inferior -->
  <circle cx="64" cy="66" r="56" fill="url(#rim-edge)" filter="url(#drop-shadow)" />

  <!-- Cuerpo esférico principal -->
  <circle cx="64" cy="62" r="56" fill="url(#sphere-surface)" />

  <!-- Bisel de iluminación superior -->
  <circle cx="64" cy="62" r="55.5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" />

  <!-- Hendiduras características de la esfera (Con bisel de luz inferior) -->
  <g fill="none" stroke-linecap="round">
    <path d="M 23 36 A 49 49 0 0 1 105 36" stroke="#064e3b" stroke-width="3.5" opacity="0.55" />
    <path d="M 23 37 A 49 49 0 0 1 105 37" stroke="#6ee7b7" stroke-width="1" opacity="0.3" />
    <path d="M 23 88 A 49 49 0 0 0 105 88" stroke="#064e3b" stroke-width="3.5" opacity="0.55" />
  </g>

  <!-- Bisel hundido del plato central -->
  <circle cx="64" cy="62" r="44.5" fill="none" stroke="#022c22" stroke-width="2" />
  <circle cx="64" cy="62" r="44" fill="url(#vinyl-core)" />

  <!-- Surcos base del vinilo (Guías concéntricas sutiles) -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <circle cx="64" cy="62" r="36" />
    <circle cx="64" cy="62" r="31" />
    <circle cx="64" cy="62" r="26" />
  </g>

  <!-- Líneas doradas de rotación ("The Spin" — 100% concéntricas y simétricas) -->
  <g fill="none" stroke-linecap="round">
    <!-- Brazo de rotación 1 (Superior) -->
    <g transform="rotate(-15 64 62)">
      <!-- Surco exterior (r=36, arco de 115 grados) -->
      <path d="M 64 26 A 36 36 0 0 1 96.6 77.2" stroke="url(#gold-trail-1)" stroke-width="3.2" />
      <!-- Surco medio (r=31, desfasado +35 grados para efecto espiral) -->
      <path d="M 64 31 A 31 31 0 0 1 92.1 75.1" stroke="url(#gold-trail-2)" stroke-width="2.2" transform="rotate(35 64 62)" />
      <!-- Surco interno (r=26, desfasado +70 grados) -->
      <path d="M 64 36 A 26 26 0 0 1 86.5 75.0" stroke="url(#gold-trail-2)" stroke-width="1.5" transform="rotate(70 64 62)" />
    </g>

    <!-- Brazo de rotación 2 (Inferior - Simetría exacta a 180 grados) -->
    <g transform="rotate(165 64 62)">
      <path d="M 64 26 A 36 36 0 0 1 96.6 77.2" stroke="url(#gold-trail-1)" stroke-width="3.2" />
      <path d="M 64 31 A 31 31 0 0 1 92.1 75.1" stroke="url(#gold-trail-2)" stroke-width="2.2" transform="rotate(35 64 62)" />
      <path d="M 64 36 A 26 26 0 0 1 86.5 75.0" stroke="url(#gold-trail-2)" stroke-width="1.5" transform="rotate(70 64 62)" />
    </g>
  </g>

  <!-- Sombra proyectada por el botón central sobre el vinilo -->
  <circle cx="64" cy="64.5" r="20.5" fill="#000000" fill-opacity="0.5" />

  <!-- Canto 3D del botón central -->
  <circle cx="64" cy="63.5" r="19.5" fill="#680921" />

  <!-- Anillo de engaste dorado/bronce alrededor del núcleo rojo -->
  <circle cx="64" cy="61.5" r="19.5" fill="url(#center-crimson)" stroke="url(#gold-bezel)" stroke-width="1.2" />

  <!-- Brillo superior interno del botón -->
  <circle cx="64" cy="61.5" r="18.3" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8" />

  <!-- Triángulo de Play (Con sombra sutil para despegarlo del fondo rojo) -->
  <path d="M 60.0 54.2 C 58.7 53.4 57.5 54.3 57.5 55.8 L 57.5 69.2 C 57.5 70.7 58.7 71.6 60.0 70.8 L 71.5 64.1 C 72.8 63.3 72.8 61.7 71.5 60.9 Z" fill="#680921" opacity="0.45" />
  <path d="M 60.0 53.0 C 58.7 52.2 57.5 53.1 57.5 54.6 L 57.5 68.0 C 57.5 69.5 58.7 70.4 60.0 69.6 L 71.5 62.9 C 72.8 62.1 72.8 60.5 71.5 59.7 Z" fill="#ffffff" />
</svg>