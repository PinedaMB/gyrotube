[package]
name = "gyrotube-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
iroh-tickets = { version = "1.0.0", default-features = false }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query", "json"] }
ring = "0.17.14"
rustypipe = { git = "https://codeberg.org/ThetaDev/rustypipe.git" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "net", "io-util"] }
ytmapi-rs = { version = "0.3.4", features = ["reqwest"] }

[dev-dependencies]
quircs = "0.10.3"
