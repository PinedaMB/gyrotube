name: Release GyroTube (Desktop & Android)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag name to publish a draft release (leave empty for dry-run build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.meta.outputs.is_release }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - name: Create or reuse draft release
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          fi

          if [[ -z "${TAG}" ]]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "tag_name=dev" >> "$GITHUB_OUTPUT"
            echo "release_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1 || true)"
          if [[ -z "${RELEASE_ID}" ]]; then
            RELEASE_NOTES="$(printf '%s\n' \
              'Cross-platform desktop installers (`.AppImage`, `.deb`, `.rpm`, `.msi`, `.exe`, `.dmg`) and Android APK (`aarch64`).' \
              '' \
              '### macOS Installation Note' \
              'Because GyroTube is not notarized with a paid Apple Developer account, macOS Gatekeeper may report that the app is *"damaged and can'\''t be opened"* after downloading. After dragging **GyroTube.app** to **Applications**, open Terminal and run:' \
              '' \
              '```bash' \
              'xattr -cr /Applications/GyroTube.app' \
              '```')"
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "GyroTube ${TAG}" \
              --notes "${RELEASE_NOTES}"
            RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)"
          fi

          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  desktop:
    name: Build Desktop (${{ matrix.label }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            platform: ubuntu-22.04
            asset_prefix: linux-x86_64
            updater_target: linux-x86_64
            target_dir: target/release/bundle
            args: ""
          - label: Windows x86_64
            platform: windows-latest
            asset_prefix: windows-x64
            updater_target: windows-x86_64
            target_dir: target/release/bundle
            args: ""
          - label: macOS Apple Silicon
            platform: macos-latest
            asset_prefix: macos-apple-silicon
            updater_target: darwin-aarch64
            target_dir: target/aarch64-apple-darwin/release/bundle
            args: "--target aarch64-apple-darwin"
          - label: macOS Intel
            platform: macos-latest
            asset_prefix: macos-intel
            updater_target: darwin-x86_64
            target_dir: target/x86_64-apple-darwin/release/bundle
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tauri/ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libasound2-dev pkg-config \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio gstreamer1.0-libav

      - name: Install UI dependencies
        run: pnpm --dir apps/tauri/ui install --frozen-lockfile

      - name: Build Tauri desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
        with:
          projectPath: apps/tauri
          args: ${{ matrix.args }}

      - name: Rename & upload platform installers to GitHub Release
        if: needs.prepare-release.outputs.is_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
          PREFIX: ${{ matrix.asset_prefix }}
          UPDATER_TARGET: ${{ matrix.updater_target }}
          BUNDLE_DIR: ${{ matrix.target_dir }}
        run: |
          mkdir -p release-assets updater-sigs
          shopt -s nullglob

          for f in "${BUNDLE_DIR}"/appimage/*.AppImage; do
            cp -f "$f" "release-assets/Gyro-${TAG}-${PREFIX}.AppImage"
            if [[ -f "${f}.sig" ]]; then
              printf '%s\n' "Gyro-${TAG}-${PREFIX}.AppImage" > "updater-sigs/${UPDATER_TARGET}.asset"
              cp -f "${f}.sig" "updater-sigs/${UPDATER_TARGET}.sig"
            fi
          done
          for f in "${BUNDLE_DIR}"/deb/*.deb; do
            cp -f "$f" "release-assets/Gyro-${TAG}-${PREFIX}.deb"
          done
          for f in "${BUNDLE_DIR}"/rpm/*.rpm; do
            cp -f "$f" "release-assets/Gyro-${TAG}-${PREFIX}.rpm"
          done
          for f in "${BUNDLE_DIR}"/msi/*.msi; do
            cp -f "$f" "release-assets/Gyro-${TAG}-${PREFIX}.msi"
          done
          for f in "${BUNDLE_DIR}"/nsis/*.exe; do
            cp -f "$f" "release-assets/Gyro-${TAG}-${PREFIX}-setup.exe"
            if [[ -f "${f}.sig" ]]; then
              printf '%s\n' "Gyro-${TAG}-${PREFIX}-setup.exe" > "updater-sigs/${UPDATER_TARGET}.asset"
              cp -f "${f}.sig" "updater-sigs/${UPDATER_TARGET}.sig"
            fi
          done
          for f in "${BUNDLE_DIR}"/dmg/*.dmg; do
            cp -f "$f" "release-assets/Gyro-${TAG}-${PREFIX}.dmg"
          done
          for f in "${BUNDLE_DIR}"/macos/*.app.tar.gz; do
            cp -f "$f" "release-assets/Gyro-${TAG}-${PREFIX}.app.tar.gz"
            if [[ -f "${f}.sig" ]]; then
              printf '%s\n' "Gyro-${TAG}-${PREFIX}.app.tar.gz" > "updater-sigs/${UPDATER_TARGET}.asset"
              cp -f "${f}.sig" "updater-sigs/${UPDATER_TARGET}.sig"
            fi
          done

          ls -lh release-assets/
          gh release upload "${TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Upload updater signature metadata
        if: needs.prepare-release.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: updater-sig-${{ matrix.updater_target }}
          path: updater-sigs/*
          if-no-files-found: ignore

  android:
    name: Build Android APK (aarch64)
    needs: prepare-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle & Maven dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Install Android NDK & Build-Tools
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "ndk;27.2.12479018" "build-tools;36.0.0"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tauri/ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI & UI dependencies
        run: |
          cargo install tauri-cli --version "^2" --locked
          pnpm --dir apps/tauri/ui install --frozen-lockfile

      - name: Initialize & configure Android project
        working-directory: apps/tauri
        run: |
          cargo tauri android init --ci
          bash android-templates/apply-android-config.sh

      - name: Configure Gradle Maven Central mirror (avoid CI 429)
        run: |
          mkdir -p "${HOME}/.gradle/init.d"
          cat <<'EOF' > "${HOME}/.gradle/init.d/maven-mirror.gradle"
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2/"
          def prependMirror = { RepositoryHandler repos ->
              def mirror = repos.maven {
                  name = "GoogleMavenCentralMirror"
                  url = uri(mirrorUrl)
              }
              repos.remove(mirror)
              repos.addFirst(mirror)
              repos.withType(MavenArtifactRepository).configureEach { repo ->
                  if (repo.url.toString().startsWith("https://repo.maven.apache.org/maven2")) {
                      repo.url = uri(mirrorUrl)
                  }
              }
          }
          gradle.beforeSettings { settings ->
              prependMirror(settings.pluginManagement.repositories)
              settings.pluginManagement.repositories.gradlePluginPortal()
          }
          allprojects {
              prependMirror(buildscript.repositories)
              prependMirror(repositories)
          }
          EOF

      - name: Build Android APK
        working-directory: apps/tauri
        run: |
          for attempt in 1 2 3; do
            if cargo tauri android build --apk --target aarch64; then
              exit 0
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              exit 1
            fi
            echo "Android build attempt ${attempt} failed (likely transient Maven/Gradle error), retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done

      - name: Align & sign Android APK
        id: sign
        env:
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          SRC_APK="apps/tauri/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          if [[ ! -f "${SRC_APK}" ]]; then
            echo "Error: unsigned APK not found at ${SRC_APK}" >&2
            exit 1
          fi

          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n 1)"
          OUT_DIR="output/android"
          mkdir -p "${OUT_DIR}"

          KEYSTORE="/tmp/gyrotube-release.keystore"
          if [[ -n "${KEYSTORE_B64}" ]]; then
            echo "${KEYSTORE_B64}" | base64 --decode > "${KEYSTORE}"
          else
            KEYSTORE_PASS="gyrotube-ci"
            KEY_ALIAS="gyrotube"
            KEY_PASS="gyrotube-ci"
            keytool -genkeypair -v \
              -keystore "${KEYSTORE}" \
              -storepass "${KEYSTORE_PASS}" \
              -alias "${KEY_ALIAS}" \
              -keypass "${KEY_PASS}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=GyroTube,O=PinedaMB,C=US"
          fi

          ALIGNED_APK="${OUT_DIR}/.aligned.apk"
          FINAL_APK="${OUT_DIR}/Gyro-${TAG}-android-aarch64.apk"

          "${BUILD_TOOLS}/zipalign" -f -p 4 "${SRC_APK}" "${ALIGNED_APK}"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-pass "pass:${KEYSTORE_PASS}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASS}" \
            --out "${FINAL_APK}" \
            "${ALIGNED_APK}"
          rm -f "${ALIGNED_APK}" "${FINAL_APK}.idsig" "${KEYSTORE}"

          echo "apk_path=${FINAL_APK}" >> "$GITHUB_OUTPUT"
          ls -lh "${FINAL_APK}"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gyrotube-android-apk
          path: ${{ steps.sign.outputs.apk_path }}

      - name: Attach Android APK to GitHub Release
        if: needs.prepare-release.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
          APK_PATH: ${{ steps.sign.outputs.apk_path }}
        run: gh release upload "${TAG}" "${APK_PATH}" --repo "${GITHUB_REPOSITORY}" --clobber

  publish-updater-manifest:
    name: Publish Tauri Updater Manifest (latest.json)
    needs: [prepare-release, desktop]
    if: always() && needs.prepare-release.outputs.is_release == 'true' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download updater signature artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: updater-sig-*
          path: all-sigs
          merge-multiple: true

      - name: Generate & upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os

          tag = os.environ["TAG"]
          version = tag.lstrip("vV")
          repo = os.environ["REPO"]
          platforms = {}

          for sig_path in sorted(glob.glob("all-sigs/*.sig")):
              target = os.path.basename(sig_path)[:-4]
              asset_file = f"all-sigs/{target}.asset"
              if not os.path.exists(asset_file):
                  continue
              asset_name = open(asset_file, encoding="utf-8").read().strip()
              signature = open(sig_path, encoding="utf-8").read().strip()
              if asset_name and signature:
                  platforms[target] = {
                      "signature": signature,
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{asset_name}",
                  }

          if not platforms:
              print("No updater signatures found (TAURI_SIGNING_PRIVATE_KEY not configured); skipping latest.json.")
              raise SystemExit(0)

          manifest = {
              "version": version,
              "notes": f"Gyro {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print("Generated latest.json for platforms:", list(platforms.keys()))
          PY
          if [[ -f latest.json ]]; then
            gh release upload "${TAG}" latest.json --repo "${GITHUB_REPOSITORY}" --clobber
          fi
