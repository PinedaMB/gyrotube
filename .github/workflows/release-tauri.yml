name: Release GyroTube (Desktop & Android)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tauri/ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Install UI dependencies
        run: pnpm --dir apps/tauri/ui install --frozen-lockfile

      - name: Build Tauri desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/tauri
          tagName: ${{ github.ref_name }}
          releaseName: "GyroTube ${{ github.ref_name }}"
          releaseBody: "Cross-platform desktop installers (.AppImage, .deb, .rpm, .msi, .exe, .dmg) and Android APK."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Build Android APK (aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK & bindgen env
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          NDK_ROOT="${ANDROID_HOME}/ndk/26.3.11579264"
          LLVM_PREBUILT="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG_INC="$(find "${LLVM_PREBUILT}/lib/clang" -maxdepth 2 -name include -type d | head -n 1)"
          echo "NDK_HOME=${NDK_ROOT}" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=${LLVM_PREBUILT}/lib64" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=${LLVM_PREBUILT}/sysroot -isystem ${CLANG_INC}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tauri/ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI & UI dependencies
        run: |
          cargo install tauri-cli --version "^2" --locked
          pnpm --dir apps/tauri/ui install --frozen-lockfile

      - name: Initialize & configure Android project
        working-directory: apps/tauri
        run: |
          cargo tauri android init --ci
          bash android-templates/apply-android-config.sh

      - name: Build Android APK
        working-directory: apps/tauri
        run: cargo tauri android build --apk --target aarch64

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gyrotube-android-apk
          path: apps/tauri/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
