name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust-workspace:
    name: Rust Core & Workspace Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust core tests
        run: cargo test -p gyrotube-core --lib
      - name: Lint workspace with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check entire workspace
        run: cargo check --workspace

  svelte-frontend:
    name: Svelte 5 Typecheck & Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tauri/ui/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir apps/tauri/ui install --frozen-lockfile
      - name: Run svelte-check
        run: pnpm --dir apps/tauri/ui check
      - name: Production Vite build
        run: pnpm --dir apps/tauri/ui build
