app-id: io.github.pinedamb.gyro
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: gyrotube-tauri

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --own-name=org.mpris.MediaPlayer2.Gyro
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-pictures/Gyro:create
  - --filesystem=xdg-download:create

modules:
  # Required at runtime on Linux by Tauri v2's tray-icon (libappindicator-sys)
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json

  # Optional yt-dlp fallback binary inside the sandbox for resilient YouTube extraction
  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.11.23/yt-dlp
        # Replace with exact release URL + sha256 before submitting to Flathub
        # (run scripts/prepare-flathub.sh to pin the exact version and sha256)
        sha256: e8665ed64d6b9172773e812f891fb707a0cb1ee8d9ef4fc1acb00cabee4c5256

  - name: gyrotube
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        CARGO_HOME: /run/build/gyrotube/cargo
        npm_config_offline: 'true'
    build-commands:
      # 1. Build Svelte 5 frontend offline (requires node-sources.json generated by flatpak-node-generator)
      - |
        cd apps/tauri/ui
        npm ci --offline --cache /run/build/gyrotube/flatpak-node/npm-cache
        npm run build
      # 2. Build Rust + Tauri binary offline using vendored cargo-sources.json
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --manifest-path apps/tauri/src-tauri/Cargo.toml --features tauri/custom-protocol
      # 3. Install binary, desktop entry, AppStream MetaInfo, and icons
      - install -Dm755 target/release/gyrotube-tauri /app/bin/gyrotube-tauri
      - install -Dm644 apps/tauri/src-tauri/linux/io.github.pinedamb.gyro.desktop /app/share/applications/io.github.pinedamb.gyro.desktop
      - install -Dm644 apps/tauri/src-tauri/linux/io.github.pinedamb.gyro.metainfo.xml /app/share/metainfo/io.github.pinedamb.gyro.metainfo.xml
      - install -Dm644 gyrotube.svg /app/share/icons/hicolor/scalable/apps/io.github.pinedamb.gyro.svg
      - install -Dm644 apps/tauri/src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.pinedamb.gyro.png
      - install -Dm644 apps/tauri/src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/io.github.pinedamb.gyro.png
      - install -Dm644 apps/tauri/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.pinedamb.gyro.png
      - install -Dm644 apps/tauri/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.pinedamb.gyro.png
      - install -Dm644 apps/tauri/src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.pinedamb.gyro.png
    sources:
      - type: git
        url: https://github.com/PinedaMB/gyrotube.git
        commit: b95da963727c2ce9281d1048dbc99abf40b2a9ee
      - cargo-sources.json
      - node-sources.json
