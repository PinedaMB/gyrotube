[workspace]
resolver = "3"
members = [
    "crates/gyrotube-core",
    "apps/tauri/src-tauri",
]
default-members = ["apps/tauri/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
