[workspace]
resolver = "3"
members = [
    "crates/gyrotube-core",
    "apps/tauri/src-tauri",
]
default-members = ["apps/tauri/src-tauri"]

[workspace.package]
version = "1.1.0"
edition = "2024"

[profile.dev.package."*"]
debug = false

[profile.dev.package.rusty-opus]
opt-level = 3

[profile.dev.package.symphonia-codec-aac]
opt-level = 2

[profile.dev.package.symphonia-format-mkv]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
